<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Somchai NFC Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#0a0a0a;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:#111827;
      border-radius:30px;
      overflow:hidden;
      border:1px solid #222;
      box-shadow:0 20px 50px rgba(0,0,0,.5);
    }

    .banner{
      height:160px;
      background:linear-gradient(
        135deg,
        #2563eb,
        #06b6d4,
        #7c3aed
      );
    }

    .content{
      padding:30px;
      margin-top:-70px;
      text-align:center;
    }

    .avatar{
      width:140px;
      height:140px;
      border-radius:50%;
      object-fit:cover;
      border:5px solid #111827;
      box-shadow:0 10px 30px rgba(0,0,0,.5);
    }

    h1{
      margin-top:18px;
      font-size:32px;
      font-weight:700;
    }

    .role{
      color:#9ca3af;
      margin-top:8px;
      font-size:16px;
    }

    .buttons{
      margin-top:35px;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .btn{
      padding:16px;
      border-radius:18px;
      text-decoration:none;
      color:white;
      font-size:17px;
      font-weight:600;
      transition:.25s;
      display:block;
    }

    .btn:hover{
      transform:translateY(-2px);
      opacity:.9;
    }

    .call{
      background:#2563eb;
    }

    .email{
      background:#1f2937;
    }

    .line{
      background:#22c55e;
    }

    .ig{
      background:#ec4899;
    }

    .save{
      background:white;
      color:black;
    }

    .footer{
      margin-top:35px;
      color:#6b7280;
      font-size:14px;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="banner"></div>

    <div class="content">

      <img
        class="avatar"
        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
      />

      <h1>Somchai Dev</h1>

      <p class="role">
        Full Stack Developer
      </p>

      <div class="buttons">

        <a class="btn call" href="tel:+66812345678">
          📞 Call
        </a>

        <a class="btn email" href="mailto:test@example.com">
          ✉️ Email
        </a>

        <a
          class="btn line"
          href="https://line.me/ti/p/yourid"
          target="_blank"
        >
          LINE
        </a>

        <a
          class="btn ig"
          href="https://instagram.com/yourid"
          target="_blank"
        >
          Instagram
        </a>

        <a
          class="btn save"
          href="contact.vcf"
        >
          💾 Save Contact
        </a>

      </div>

      <div class="footer">
        Tap NFC to connect instantly
      </div>

    </div>

  </div>

</body>
</html>
