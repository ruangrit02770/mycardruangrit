<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NFC Business Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Inter',sans-serif;

      background:
        radial-gradient(circle at top,
        #0ea5e9 0%,
        #020617 65%);

      min-height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

      padding:20px;

      color:white;
    }

    .card{

      width:100%;

      max-width:430px;

      background:
        rgba(15,23,42,.78);

      backdrop-filter:blur(20px);

      border:
        1px solid rgba(255,255,255,.08);

      border-radius:34px;

      overflow:hidden;

      box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        0 0 50px rgba(14,165,233,.12);
    }

    .banner{

      height:180px;

      background:
        linear-gradient(
          135deg,
          #0284c7,
          #0ea5e9,
          #38bdf8,
          #2563eb
        );

      position:relative;
    }

    .banner::after{

      content:'';

      position:absolute;

      inset:0;

      background:
        linear-gradient(
          transparent,
          rgba(0,0,0,.15)
        );
    }

    .content{

      padding:30px;

      margin-top:-75px;

      text-align:center;

      position:relative;

      z-index:5;
    }

    .avatar{

      width:145px;

      height:145px;

      border-radius:50%;

      object-fit:cover;

      border:5px solid #0f172a;

      box-shadow:
        0 10px 35px rgba(0,0,0,.45);
    }

    h1{

      margin-top:18px;

      font-size:32px;

      font-weight:700;

      letter-spacing:-1px;
    }

    .position{

      margin-top:10px;

      color:#7dd3fc;

      font-size:17px;

      font-weight:600;
    }

    .company{

      margin-top:6px;

      color:#cbd5e1;

      font-size:15px;
    }

    .buttons{

      margin-top:35px;

      display:flex;

      flex-direction:column;

      gap:16px;
    }

    .circle-btn{

      display:flex;

      align-items:center;

      gap:16px;

      padding:16px;

      border-radius:24px;

      text-decoration:none;

      color:white;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid rgba(255,255,255,.08);

      backdrop-filter:blur(14px);

      transition:.25s;
    }

    .circle-btn:hover{

      transform:translateY(-3px);

      background:
        rgba(255,255,255,.09);
    }

    .icon{

      width:60px;

      height:60px;

      border-radius:50%;

      display:flex;

      justify-content:center;

      align-items:center;

      font-size:20px;

      font-weight:700;

      flex-shrink:0;

      box-shadow:
        0 5px 15px rgba(0,0,0,.25);
    }

    .phone{
      background:#0284c7;
    }

    .mail{
      background:#1e293b;
    }

    .line{
      background:#06c755;
      font-size:14px;
    }

    .save{
      background:white;
      color:#0f172a;
    }

    .info{

      text-align:left;
    }

    .info span{

      display:block;

      font-size:17px;

      font-weight:600;
    }

    .info small{

      color:#94a3b8;

      font-size:13px;
    }

    .footer{

      margin-top:35px;

      color:#94a3b8;

      font-size:13px;

      letter-spacing:.5px;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="banner"></div>

    <div class="content">

      <img
        class="avatar"
        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
      />

      <h1>Somchai Dev</h1>

      <div class="position">
        Full Stack Developer
      </div>

      <div class="company">
        BlueWave Technology Co., Ltd.
      </div>

      <div class="buttons">

        <a
          class="circle-btn"
          href="tel:+66812345678"
        >

          <div class="icon phone">
            📞
          </div>

          <div class="info">
            <span>Phone</span>
            <small>+66 81 234 5678</small>
          </div>

        </a>

        <a
          class="circle-btn"
          href="mailto:test@example.com"
        >

          <div class="icon mail">
            ✉️
          </div>

          <div class="info">
            <span>Email</span>
            <small>test@example.com</small>
          </div>

        </a>

        <a
          class="circle-btn"
          href="https://line.me/ti/p/yourid"
          target="_blank"
        >

          <div class="icon line">
            LINE
          </div>

          <div class="info">
            <span>LINE</span>
            <small>@yourid</small>
          </div>

        </a>

        <a
          class="circle-btn"
          href="contact.vcf"
        >

          <div class="icon save">
            💾
          </div>

          <div class="info">
            <span>Save Contact</span>
            <small>Add to iPhone / Android</small>
          </div>

        </a>

      </div>

      <div class="footer">
        NFC Digital Business Card
      </div>

    </div>

  </div>

</body>

</html>
