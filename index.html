<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>NFC Business Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Inter',sans-serif;

      background:
        linear-gradient(
          180deg,
          #020617,
          #081226
        );

      min-height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

      padding:24px;

      color:white;
    }

    .card{

      width:100%;
      max-width:390px;

      background:#0f172a;

      border-radius:38px;

      overflow:hidden;

      box-shadow:
        0 30px 80px rgba(0,0,0,.6);

      position:relative;
    }

    .top{

      height:280px;

      position:relative;

      overflow:hidden;
    }

    .top img{

      width:100%;
      height:100%;

      object-fit:cover;
    }

    .overlay{

      position:absolute;

      inset:0;

      background:
        linear-gradient(
          to top,
          rgba(15,23,42,1),
          rgba(15,23,42,.15)
        );
    }

    .profile{

      position:absolute;

      left:28px;
      bottom:26px;

      z-index:5;
    }

    h1{

      font-size:42px;

      font-weight:800;

      line-height:.95;

      letter-spacing:-2px;
    }

    .position{

      margin-top:10px;

      color:#cbd5e1;

      font-size:16px;
    }

    .company{

      margin-top:12px;

      display:inline-flex;

      align-items:center;

      gap:10px;

      background:
        rgba(255,255,255,.08);

      padding:10px 14px;

      border-radius:999px;

      backdrop-filter:blur(10px);

      font-size:14px;
    }

    .dot{

      width:10px;
      height:10px;

      border-radius:50%;

      background:#38bdf8;

      box-shadow:
        0 0 12px #38bdf8;
    }

    .actions{

      display:flex;

      justify-content:center;

      gap:14px;

      margin-top:-28px;

      position:relative;

      z-index:10;
    }

    .icon-btn{

      width:64px;
      height:64px;

      border-radius:22px;

      background:#111827;

      border:
        1px solid rgba(255,255,255,.06);

      display:flex;

      justify-content:center;

      align-items:center;

      text-decoration:none;

      color:white;

      font-size:24px;

      transition:.25s;

      box-shadow:
        0 10px 25px rgba(0,0,0,.35);
    }

    .icon-btn:hover{

      transform:translateY(-4px);

      background:#1e293b;
    }

    .content{

      padding:32px 24px 24px;
    }

    .section{

      margin-top:10px;

      background:
        rgba(255,255,255,.03);

      border:
        1px solid rgba(255,255,255,.05);

      border-radius:26px;

      padding:24px;
    }

    .section h2{

      font-size:22px;

      margin-bottom:14px;

      font-weight:700;
    }

    .section p{

      color:#cbd5e1;

      line-height:1.7;

      font-size:15px;
    }

    .save{

      margin-top:22px;

      display:flex;

      align-items:center;

      justify-content:center;

      gap:12px;

      width:100%;

      padding:18px;

      border-radius:22px;

      text-decoration:none;

      background:
        linear-gradient(
          135deg,
          #0ea5e9,
          #2563eb
        );

      color:white;

      font-weight:700;

      font-size:16px;

      transition:.25s;
    }

    .save:hover{

      transform:translateY(-3px);

      opacity:.92;
    }

    .footer{

      margin-top:18px;

      text-align:center;

      color:#64748b;

      font-size:12px;

      letter-spacing:.5px;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="top">

      <img
        src="https://drive.google.com/thumbnail?id=AKGpihZ-7S6xKI8PtlzclyaC5VewwYJVXY-BlRKuCeB1akPSp9YxH6y4FBr3pJB8DXnvK2eFrpKA_JPu27Z_iXaFHW3BQSotSUBZk8Y"
      />

      <div class="overlay"></div>

      <div class="profile">

        <h1>
          SOMCHAI<br>
          DEV
        </h1>

        <div class="position">
          Full Stack Developer
        </div>

        <div class="company">

          <div class="dot"></div>

          BlueWave Technology

        </div>

      </div>

    </div>

    <div class="actions">

      <a
        class="icon-btn"
        href="tel:+66812345678"
      >
        📞
      </a>

      <a
        class="icon-btn"
        href="mailto:test@example.com"
      >
        ✉️
      </a>

      <a
        class="icon-btn"
        href="https://line.me/ti/p/yourid"
        target="_blank"
      >
        💬
      </a>

    </div>

    <div class="content">

      <div class="section">

        <h2>About Me</h2>

        <p>
          Passionate full stack developer focused on
          modern web applications, UI/UX experience,
          scalable backend systems and digital product
          development.
        </p>

      </div>

      <a
        class="save"
        href="contact.vcf"
      >
        💾 Save Contact
      </a>

      <div class="footer">
        NFC DIGITAL BUSINESS CARD
      </div>

    </div>

  </div>

</body>

</html>
