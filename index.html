<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>NFC Business Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Inter',sans-serif;

      background:

        radial-gradient(
          circle at top,
          #0ea5e9 0%,
          #020617 35%
        ),

        #020617;

      min-height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

      padding:24px;

      color:white;
    }

    .card{

      width:100%;
      max-width:390px;

      background:
        linear-gradient(
          180deg,
          rgba(15,23,42,.98),
          rgba(2,6,23,1)
        );

      border-radius:38px;

      overflow:hidden;

      border:
        1px solid rgba(255,255,255,.05);

      box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        0 0 60px rgba(56,189,248,.08);

      position:relative;
    }

    .top{

      height:520px;

      position:relative;

      overflow:hidden;
    }

    .top img{

      width:100%;
      height:100%;

      object-fit:cover;

      object-position:center top;

      filter:
        contrast(1.05)
        saturate(.95)
        brightness(.92);

      transform:scale(1.02);
    }

    .overlay{

      position:absolute;

      inset:0;

      background:

        linear-gradient(
          to top,
          rgba(2,6,23,1) 10%,
          rgba(2,6,23,.72) 35%,
          rgba(2,6,23,.10) 68%
        ),

        radial-gradient(
          circle at top right,
          rgba(56,189,248,.35),
          transparent 35%
        );
    }

    .profile{

      position:absolute;

      left:28px;
      bottom:34px;

      z-index:5;
    }

    h1{

      font-size:42px;

      font-weight:800;

      line-height:.95;

      letter-spacing:-2px;
    }

    .position{

      margin-top:12px;

      color:#cbd5e1;

      font-size:16px;

      font-weight:500;
    }

    .company{

      margin-top:8px;

      color:#94a3b8;

      font-size:14px;

      font-weight:500;

      letter-spacing:.3px;
    }

    .actions{

      display:flex;

      justify-content:center;

      gap:16px;

      padding:22px;

      background:
        rgba(15,23,42,.92);

      border-top:
        1px solid rgba(255,255,255,.05);
    }

    .icon-btn{

      width:68px;
      height:68px;

      border-radius:24px;

      background:
        rgba(255,255,255,.04);

      border:
        1px solid rgba(255,255,255,.06);

      display:flex;

      justify-content:center;

      align-items:center;

      text-decoration:none;

      color:white;

      font-size:26px;

      transition:.25s;

      backdrop-filter:blur(12px);
    }

    .icon-btn:hover{

      transform:translateY(-4px);

      background:
        rgba(255,255,255,.08);
    }

    .save{

      margin:0 22px 22px;

      display:flex;

      align-items:center;

      justify-content:center;

      gap:12px;

      padding:18px;

      border-radius:24px;

      text-decoration:none;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid rgba(255,255,255,.08);

      color:white;

      font-weight:600;

      font-size:16px;

      transition:.25s;

      backdrop-filter:blur(12px);
    }

    .save:hover{

      transform:translateY(-3px);

      background:
        rgba(255,255,255,.08);
    }

    .save-icon{

      width:30px;
      height:30px;

      border-radius:50%;

      background:
        linear-gradient(
          135deg,
          #0ea5e9,
          #2563eb
        );

      display:flex;

      align-items:center;

      justify-content:center;

      font-size:20px;

      font-weight:700;

      box-shadow:
        0 0 18px rgba(14,165,233,.45);
    }

    .footer{

      padding-bottom:22px;

      text-align:center;

      color:#64748b;

      font-size:12px;

      letter-spacing:.5px;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="top">

      <img
        src="./profile.jpg"
      />

      <div class="overlay"></div>

      <div class="profile">

        <h1>
          SOMCHAI<br>
          DEV
        </h1>

        <div class="position">
          Full Stack Developer
        </div>

        <div class="company">
          BlueWave Technology
        </div>

      </div>

    </div>

    <div class="actions">

      <a
        class="icon-btn"
        href="tel:+66812345678"
      >
        📞
      </a>

      <a
        class="icon-btn"
        href="mailto:test@example.com"
      >
        ✉️
      </a>

      <a
        class="icon-btn"
        href="https://line.me/ti/p/yourid"
        target="_blank"
      >
        💬
      </a>

    </div>

    <a
      class="save"
      href="contact.vcf"
    >

      <span class="save-icon">
        +
      </span>

      Add Contact

    </a>

    <div class="footer">
      NFC DIGITAL BUSINESS CARD
    </div>

  </div>

</body>

</html>
