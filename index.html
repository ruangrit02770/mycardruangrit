<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>NFC Business Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Inter',sans-serif;

      background:
        #050816;

      min-height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

      padding:24px;

      color:white;

      overflow:hidden;
    }

    body::before{

      content:'';

      position:fixed;

      width:500px;
      height:500px;

      background:
        radial-gradient(
          circle,
          rgba(56,189,248,.18),
          transparent 70%
        );

      top:-180px;
      right:-120px;

      filter:blur(20px);
    }

    .card{

      width:100%;
      max-width:400px;

      background:
        rgba(15,23,42,.72);

      backdrop-filter:
        blur(22px);

      border:
        1px solid rgba(255,255,255,.06);

      border-radius:32px;

      padding:42px 28px;

      box-shadow:
        0 20px 80px rgba(0,0,0,.45);

      position:relative;
    }

    .status{

      width:12px;
      height:12px;

      border-radius:50%;

      background:#38bdf8;

      margin:auto;

      box-shadow:
        0 0 18px #38bdf8;
    }

    .avatar{

      width:108px;
      height:108px;

      border-radius:50%;

      object-fit:cover;

      display:block;

      margin:28px auto 0;

      border:
        2px solid rgba(255,255,255,.08);
    }

    h1{

      margin-top:22px;

      text-align:center;

      font-size:32px;

      font-weight:700;

      letter-spacing:-1.2px;
    }

    .position{

      text-align:center;

      margin-top:10px;

      color:#7dd3fc;

      font-size:15px;

      font-weight:600;
    }

    .company{

      text-align:center;

      margin-top:6px;

      color:#94a3b8;

      font-size:14px;
    }

    .divider{

      width:100%;

      height:1px;

      background:
        rgba(255,255,255,.06);

      margin:34px 0 26px;
    }

    .action{

      display:flex;

      align-items:center;

      justify-content:space-between;

      text-decoration:none;

      color:white;

      padding:18px 20px;

      border-radius:22px;

      background:
        rgba(255,255,255,.03);

      border:
        1px solid rgba(255,255,255,.05);

      margin-bottom:16px;

      transition:.25s;
    }

    .action:hover{

      transform:translateY(-2px);

      background:
        rgba(255,255,255,.05);
    }

    .left{

      display:flex;

      align-items:center;

      gap:16px;
    }

    .icon{

      width:52px;
      height:52px;

      border-radius:18px;

      display:flex;

      justify-content:center;

      align-items:center;

      font-size:20px;

      background:
        rgba(56,189,248,.12);

      color:#7dd3fc;
    }

    .label{

      display:flex;

      flex-direction:column;
    }

    .label span{

      font-size:16px;

      font-weight:600;
    }

    .label small{

      margin-top:4px;

      color:#94a3b8;

      font-size:13px;
    }

    .arrow{

      color:#64748b;

      font-size:20px;
    }

    .footer{

      text-align:center;

      margin-top:30px;

      color:#64748b;

      font-size:12px;

      letter-spacing:.4px;
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="status"></div>

    <img
      class="avatar"
     src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop"
    />

    <h1>Somchai Dev</h1>

    <div class="position">
      Full Stack Developer
    </div>

    <div class="company">
      BlueWave Technology Co., Ltd.
    </div>

    <div class="divider"></div>

    <a
      class="action"
      href="tel:+66812345678"
    >

      <div class="left">

        <div class="icon">
          📞
        </div>

        <div class="label">
          <span>Phone</span>
          <small>+66 81 234 5678</small>
        </div>

      </div>

      <div class="arrow">
        →
      </div>

    </a>

    <a
      class="action"
      href="mailto:test@example.com"
    >

      <div class="left">

        <div class="icon">
          ✉️
        </div>

        <div class="label">
          <span>Email</span>
          <small>test@example.com</small>
        </div>

      </div>

      <div class="arrow">
        →
      </div>

    </a>

    <a
      class="action"
      href="https://line.me/ti/p/yourid"
      target="_blank"
    >

      <div class="left">

        <div class="icon">
          LINE
        </div>

        <div class="label">
          <span>LINE</span>
          <small>@yourid</small>
        </div>

      </div>

      <div class="arrow">
        →
      </div>

    </a>

    <a
      class="action"
      href="contact.vcf"
    >

      <div class="left">

        <div class="icon">
          💾
        </div>

        <div class="label">
          <span>Save Contact</span>
          <small>Add to Contacts</small>
        </div>

      </div>

      <div class="arrow">
        →
      </div>

    </a>

    <div class="footer">
      NFC DIGITAL BUSINESS CARD
    </div>

  </div>

</body>

</html>
